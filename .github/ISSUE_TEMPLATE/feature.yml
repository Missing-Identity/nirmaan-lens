name: Feature proposal
description: Propose a scoped product, architecture, retrieval, or evaluation improvement.
title: "[Feature]: "
labels:
  - triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or engineering problem without prescribing a solution first.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and measurement
      description: State which corpus examples, evaluation slices, or metrics should validate the change.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and alternatives
