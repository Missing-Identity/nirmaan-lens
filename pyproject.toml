[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nirmaan-lens"
version = "0.1.0"
description = "Source-grounded building-permission intelligence for Hyderabad"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NirmaanLens contributors" }]
dependencies = [
  "httpx[socks]>=0.28",
  "numpy>=1.26",
  "openai>=1.68.0",
  "pypdf>=5.1",
  "python-dotenv>=1.0",
  "requests>=2.32",
  "streamlit>=1.40",
  "tiktoken>=0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
nirmaan-lens = "nirmaan_lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
